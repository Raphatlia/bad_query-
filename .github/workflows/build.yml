name: Build bad_query IPA

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files
        run: |
          ls -la
          ls -la bad_query/

      - name: Compile
        run: |
          cd bad_query
          ls -la
          mkdir -p build
          xcrun -sdk iphoneos clang -arch arm64 -c *.c -o build/bad_query.o
          xcrun -sdk iphoneos clang -arch arm64 build/bad_query.o -o build/bad_query

      - name: Create IPA
        run: |
          cd bad_query
          mkdir -p Payload/bad_query.app
          cp build/bad_query Payload/bad_query.app/
          echo "APPL????" > Payload/bad_query.app/PkgInfo
          zip -r bad_query.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query_ipa
          path: bad_query/bad_query.ipa
