name: Build bad_query IPA

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        run: |
          cd bad_query
          xcodebuild -project bad_query.xcodeproj -scheme bad_query -sdk iphoneos -configuration Release archive -archivePath bad_query.xcarchive

      - name: Export IPA
        run: |
          cd bad_query
          mkdir -p build/
          xcodebuild -exportArchive -archivePath bad_query.xcarchive -exportPath build/ -exportOptionsPlist /dev/stdin <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>development</string>
            </dict>
          </plist>
          EOF

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query_ipa
          path: bad_query/build/*.ipa
