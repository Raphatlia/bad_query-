name: Build bad_query IPA

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project structure
        run: ls -la

      - name: Build .app
        run: |
          xcodebuild -project bad_query.xcodeproj -scheme bad_query -sdk iphoneos -configuration Release build CONFIGURATION_BUILD_DIR=./build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/bad_query.app Payload/
          zip -r bad_query.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query_ipa
          path: bad_query.ipa
