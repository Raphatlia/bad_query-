name: Build bad_query IPA

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile manually
        run: |
          cd bad_query
          mkdir -p build
          swiftc -sdk $(xcrun --show-sdk-path --sdk iphoneos) -target arm64-apple-ios -emit-object -o build/bad_query.o bad_query.c
          swiftc -sdk $(xcrun --show-sdk-path --sdk iphoneos) -target arm64-apple-ios -emit-object -o build/ContentView.o ContentView.swift
          swiftc -sdk $(xcrun --show-sdk-path --sdk iphoneos) -target arm64-apple-ios -o build/bad_query build/bad_query.o build/ContentView.o

      - name: Create app bundle
        run: |
          cd bad_query
          mkdir -p Payload/bad_query.app
          cp build/bad_query Payload/bad_query.app/
          cp -r Assets.xcassets Payload/bad_query.app/ || true
          echo "APPL????" > Payload/bad_query.app/PkgInfo

      - name: Create IPA
        run: |
          cd bad_query
          zip -r bad_query.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query_ipa
          path: bad_query/bad_query.ipa
